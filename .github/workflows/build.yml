name: Build APK

# Note: this project ships gradle-wrapper.properties (which Gradle version to
# use) but NOT the gradle-wrapper.jar binary (it can't be generated from a
# text-only source drop). Android Studio regenerates that jar automatically
# the first time you open the project, so local builds still work with
# ./gradlew. Here in CI we skip the wrapper entirely and let setup-gradle
# install the matching Gradle version directly.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PumpWatch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
